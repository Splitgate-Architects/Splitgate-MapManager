<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Splitgate Map Manager</title>
    <meta name="title" content="Splitgate Map Manager">
    <meta name="description" content="Drop, view, inspect, edit metadata, filter, create playlists, and package map packs directly in your browser.">
    <meta name="theme-color" content="#3b82f6">

    <!-- JSZip Library für das Auslesen und Packen im Browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 1200px;
            margin: auto auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: margin 0.3s ease;
        }
        .container.has-maps {
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .card-box {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 20px;
        }

        .dropzone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: rgba(15, 23, 42, 0.3);
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }
        .dropzone p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        .dropzone b {
            color: var(--text-color);
        }

        /* Such- und Kontrollleiste */
        .controls {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .controls.active {
            display: flex;
        }
        input[type="text"]#search {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            width: 100%;
            max-width: 350px;
        }
        input[type="text"]#search:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        /* Toolbar für Playlist-Export */
        .batch-toolbar {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .batch-toolbar.active {
            display: flex;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: var(--text-muted);
        }
        .card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
            background: rgba(59, 130, 246, 0.03);
        }
        .card.edited {
            border-color: var(--success);
        }

        .card-select-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            width: 24px;
            height: 24px;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 12px;
            transition: all 0.2s;
        }
        .card.selected .card-select-indicator {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 160px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .no-image {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            gap: 12px;
        }
        .map-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .map-author {
            color: var(--text-muted);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badges {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .badge-edited { background: var(--success); color: white; }
        
        .btn {
            display: inline-block;
            text-align: center;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: var(--accent-hover);
        }
        .btn-secondary {
            background: #334155;
        }
        .btn-secondary:hover {
            background: #475569;
        }

        /* Modal / Lightbox */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            max-width: 95vw;
            max-height: 95vh;
            width: auto;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            background: rgba(30, 41, 59, 0.95);
        }
        .modal-title-area {
            font-size: 16px;
            font-weight: bold;
        }
        .modal-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }
        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
        }
        .close-btn:hover {
            color: var(--text-color);
        }
        
        .modal-body {
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            overflow: hidden;
        }
        .modal-body img {
            max-width: 90vw;
            max-height: 75vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 20px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s, transform 0.2s;
            z-index: 10;
        }
        .nav-arrow:hover {
            background: rgba(59, 130, 246, 0.9);
            transform: translateY(-50%) scale(1.05);
        }
        .prev-arrow { left: 20px; }
        .next-arrow { right: 20px; }
        
        .modal-footer {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.95);
            border-top: 1px solid #334155;
            gap: 15px;
            flex-wrap: wrap;
        }
        .modal-file-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-file-text {
            font-family: monospace;
            font-size: 12px;
            color: var(--text-muted);
            word-break: break-all;
        }
        .modal-file-text span {
            color: var(--text-color);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Edit-Bereich als sauberes Overlay ohne störende blaue Linie */
        .modal-edit-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateY(100%);
            transition: transform 0.25s ease-in-out;
            z-index: 20;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.6);
        }
        .modal-edit-panel.active {
            transform: translateY(0);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }
        input[type="text"].modal-input, textarea {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 13px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input[type="text"].modal-input:focus, textarea:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }
        textarea {
            resize: vertical;
            height: 50px;
        }

        .hidden {
            display: none !important;
        }
        #status-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <header>
        <h1>Splitgate Map Manager</h1>
        <p>Drop your map folders or multiple .bin files to browse, search, edit metadata, create playlists, and package map packs.</p>
    </header>

    <div class="card-box">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
            <p>📁 Drag & drop your map folders or <b>.bin</b> files here<br>or <span>browse files</span></p>
            <input type="file" id="file-input" class="hidden" multiple accept=".bin,.zip">
        </div>
        <div id="status-msg"></div>
    </div>

    <!-- Suchleiste -->
    <div class="controls" id="controls-bar">
        <input type="text" id="search" placeholder="Search map name or author..." oninput="filterMaps()">
    </div>

    <!-- Toolbar für Playlist-Export -->
    <div class="batch-toolbar" id="batch-toolbar">
        <span id="selection-count" style="font-size: 14px; font-weight: 600;">0 maps selected</span>
        <button class="btn" onclick="downloadSelectedMapPack()">📦 Download Selected as Map Pack (.zip)</button>
    </div>

    <div class="grid" id="map-grid"></div>
</div>

<!-- Modal / Lightbox -->
<div class="modal" id="map-modal" onclick="closeModalOnBg(event)">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <div class="modal-title-area" id="modal-title">Map Title</div>
                <div class="modal-subtitle" id="modal-subtitle">by Author</div>
            </div>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        
        <div class="modal-body">
            <button class="nav-arrow prev-arrow" onclick="changeMap(-1)">&#10094;</button>
            <img id="modal-img" src="" alt="Map Preview">
            <button class="nav-arrow next-arrow" onclick="changeMap(1)">&#10095;</button>

            <!-- Edit-Bereich als Overlay -->
            <div class="modal-edit-panel" id="edit-panel">
                <div class="form-row">
                    <div class="form-group">
                        <label for="modal-name">Map Name</label>
                        <input type="text" id="modal-name" class="modal-input" placeholder="Map Name" oninput="markAsEdited(); syncHeaderLive();">
                    </div>
                    <div class="form-group">
                        <label for="modal-author">Author</label>
                        <input type="text" id="modal-author" class="modal-input" placeholder="Author" oninput="markAsEdited(); syncHeaderLive();">
                    </div>
                </div>
                <div class="form-group full-width">
                    <label for="modal-desc">Description (Optional)</label>
                    <textarea id="modal-desc" placeholder="Write a short description..." oninput="markAsEdited()"></textarea>
                </div>
                <div class="form-group full-width">
                    <label>Preview Image (Auto-crops to 16:9 / 1280x720px)</label>
                    <input type="file" id="modal-img-upload" class="hidden" accept="image/*" onchange="handleImageUpload(event)">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal-img-upload').click()">🖼️ Change Preview Image</button>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <div class="modal-file-box">
                <div class="modal-file-text">File: <span id="modal-filename">filename.bin</span></div>
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" id="modal-copy-btn" onclick="copyModalFileName()">📋 Copy</button>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="edit-toggle-btn" onclick="toggleEditPanel()">✏️ Edit Metadata</button>
            </div>
        </div>
    </div>
</div>

<script>
    let loadedMaps = [];
    let filteredMaps = [];
    let currentIndex = 0;

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const mapGrid = document.getElementById('map-grid');
    const statusMsg = document.getElementById('status-msg');
    const mainContainer = document.getElementById('main-container');
    const batchToolbar = document.getElementById('batch-toolbar');
    const controlsBar = document.getElementById('controls-bar');

    ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
        }, false);
    });

    dropzone.addEventListener('drop', async (e) => {
        const items = e.dataTransfer.items;
        if (items) {
            let filesList = [];
            for (let i = 0; i < items.length; i++) {
                const entry = items[i].webkitGetAsEntry();
                if (entry) {
                    await traverseFileTree(entry, filesList);
                }
            }
            processFiles(filesList);
        }
    });

    fileInput.addEventListener('change', (e) => {
        processFiles(e.target.files);
    });

    async function traverseFileTree(item, filesList) {
        if (item.isFile) {
            await new Promise((resolve) => {
                item.file(file => {
                    filesList.push(file);
                    resolve();
                });
            });
        } else if (item.isDirectory) {
            const dirReader = item.createReader();
            await new Promise((resolve) => {
                dirReader.readEntries(async (entries) => {
                    for (let i = 0; i < entries.length; i++) {
                        await traverseFileTree(entries[i], filesList);
                    }
                    resolve();
                });
            });
        }
    }

    async function processFiles(files) {
        const binFiles = Array.from(files).filter(f => f.name.endsWith('.bin') || f.name.endsWith('.zip'));
        
        if (binFiles.length === 0) {
            statusMsg.textContent = "No valid .bin files found in the dropped items.";
            return;
        }

        mainContainer.classList.add('has-maps');
        controlsBar.classList.add('active');
        mapGrid.innerHTML = '';
        statusMsg.textContent = `Processing ${binFiles.length} map(s)...`;
        loadedMaps = [];

        for (let file of binFiles) {
            try {
                const zip = new JSZip();
                const loadedZip = await zip.loadAsync(file);

                let mapName = "Unknown Map";
                let author = "Unknown Author";
                let description = "";
                let imageBlob = null;
                let imagePath = "screenshot.jpg";
                let foundInfo = null;

                for (let relativePath of Object.keys(loadedZip.files)) {
                    let lower = relativePath.toLowerCase();
                    if (lower === 'info.json') {
                        foundInfo = await loadedZip.files[relativePath].async('string');
                    } else if (lower.endsWith('.jpg') || lower.endsWith('.png')) {
                        imagePath = relativePath;
                        imageBlob = await loadedZip.files[relativePath].async('blob');
                    }
                }

                if (foundInfo) {
                    try {
                        const cleanJson = foundInfo.trim().replace(/^\uFEFF/, '');
                        const data = JSON.parse(cleanJson);
                        if (data.name) mapName = data.name;
                        if (data.author) author = data.author;
                        if (data.description) description = data.description;
                    } catch (err) {
                        console.error("Error parsing info.json", err);
                    }
                }

                let imageUrl = imageBlob ? URL.createObjectURL(imageBlob) : null;

                loadedMaps.push({
                    name: mapName,
                    author: author,
                    description: description,
                    fileName: file.name,
                    image: imageUrl,
                    imageBlob: imageBlob,
                    imagePath: imagePath,
                    zipObject: loadedZip,
                    isEdited: false,
                    selected: false
                });
            } catch (err) {
                console.error("Failed to read: " + file.name, err);
            }
        }

        filterMaps();
        statusMsg.textContent = `Successfully loaded and identified ${loadedMaps.length} map(s).`;
    }

    function filterMaps() {
        const query = document.getElementById('search').value.toLowerCase();
        
        filteredMaps = loadedMaps.filter(map => {
            return map.name.toLowerCase().includes(query) || map.author.toLowerCase().includes(query);
        });

        renderGrid();
    }

    function renderGrid() {
        mapGrid.innerHTML = '';
        
        if (filteredMaps.length === 0) {
            mapGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No maps match your search.</p>';
            return;
        }

        filteredMaps.forEach((map) => {
            const globalIndex = loadedMaps.indexOf(map);

            const card = document.createElement('div');
            card.className = `card ${map.selected ? 'selected' : ''} ${map.isEdited ? 'edited' : ''}`;
            card.onclick = () => toggleSelectMap(globalIndex);

            const cardImgId = `card-img-${globalIndex}`;
            let imgHtml = `<div class="card-img-wrapper" id="${cardImgId}"><span class="no-image">No Preview Image</span></div>`;
            if (map.image) {
                imgHtml = `<div class="card-img-wrapper" id="${cardImgId}"><img src="${map.image}" alt="${escapeHtml(map.name)}"></div>`;
            }

            card.innerHTML = `
                <div class="card-select-indicator">✓</div>
                ${imgHtml}
                <div class="card-content">
                    <div>
                        <div class="map-title" id="card-title-${globalIndex}">${escapeHtml(map.name)}</div>
                        <div class="map-author" id="card-author-${globalIndex}">by ${escapeHtml(map.author)}</div>
                        <div class="badges">
                            ${map.isEdited ? '<span class="badge badge-edited">Edited</span>' : ''}
                        </div>
                    </div>
                    <button class="btn" onclick="event.stopPropagation(); openModal(${globalIndex})">🔍 Details & Edit</button>
                </div>
            `;
            mapGrid.appendChild(card);
        });
        updateBatchToolbar();
    }

    function toggleSelectMap(index) {
        loadedMaps[index].selected = !loadedMaps[index].selected;
        renderGrid();
    }

    function updateBatchToolbar() {
        const selectedCount = loadedMaps.filter(m => m.selected).length;
        if (selectedCount > 0) {
            batchToolbar.classList.add('active');
            document.getElementById('selection-count').textContent = `${selectedCount} map(s) selected`;
        } else {
            batchToolbar.classList.remove('active');
        }
    }

    function openModal(index) {
        currentIndex = index;
        document.getElementById('edit-panel').classList.remove('active');
        document.getElementById('edit-toggle-btn').textContent = '✏️ Edit Metadata';
        updateModalContent();
        document.getElementById('map-modal').classList.add('active');
    }

    function closeModal() {
        saveCurrentModalData();
        document.getElementById('map-modal').classList.remove('active');
        filterMaps();
    }

    function closeModalOnBg(event) {
        if (event.target.id === 'map-modal') {
            closeModal();
        }
    }

    function toggleEditPanel() {
        const panel = document.getElementById('edit-panel');
        const btn = document.getElementById('edit-toggle-btn');
        panel.classList.toggle('active');
        if (panel.classList.contains('active')) {
            btn.textContent = '❌ Close Editor';
            btn.style.background = '#475569';
        } else {
            btn.textContent = '✏️ Edit Metadata';
            btn.style.background = '#334155';
            saveCurrentModalData();
        }
    }

    function markAsEdited() {
        const map = loadedMaps[currentIndex];
        if (!map) return;
        map.isEdited = true;
    }

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 1280;
                canvas.height = 720;
                const ctx = canvas.getContext('2d');

                const targetAspect = 1280 / 720;
                const imgAspect = img.width / img.height;

                let sx = 0, sy = 0, sw = img.width, sh = img.height;

                if (imgAspect > targetAspect) {
                    sw = img.height * targetAspect;
                    sx = (img.width - sw) / 2;
                } else {
                    sh = img.width / targetAspect;
                    sy = (img.height - sh) / 2;
                }

                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 1280, 720);

                canvas.toBlob((blob) => {
                    const map = loadedMaps[currentIndex];
                    map.imageBlob = blob;
                    map.image = URL.createObjectURL(blob);
                    
                    document.getElementById('modal-img').src = map.image;
                    const cardWrapper = document.getElementById(`card-img-${currentIndex}`);
                    if (cardWrapper) {
                        cardWrapper.innerHTML = `<img src="${map.image}" alt="${escapeHtml(map.name)}">`;
                    }

                    markAsEdited();
                }, 'image/jpeg', 0.9);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function changeMap(direction) {
        saveCurrentModalData();
        currentIndex += direction;
        if (currentIndex < 0) {
            currentIndex = loadedMaps.length - 1;
        } else if (currentIndex >= loadedMaps.length) {
            currentIndex = 0;
        }
        updateModalContent();
    }

    function updateModalContent() {
        const map = loadedMaps[currentIndex];
        if (!map) return;

        document.getElementById('modal-name').value = map.name;
        document.getElementById('modal-author').value = map.author;
        document.getElementById('modal-desc').value = map.description || "";
        document.getElementById('modal-filename').textContent = map.fileName;
        
        document.getElementById('modal-title').textContent = map.name;
        document.getElementById('modal-subtitle').textContent = `by ${map.author}`;

        const imgElement = document.getElementById('modal-img');
        if (map.image) {
            imgElement.src = map.image;
            imgElement.style.display = 'block';
        } else {
            imgElement.style.display = 'none';
        }
    }

    function syncHeaderLive() {
        const nameVal = document.getElementById('modal-name').value.trim() || "Unknown Map";
        const authorVal = document.getElementById('modal-author').value.trim() || "Unknown Author";
        document.getElementById('modal-title').textContent = nameVal;
        document.getElementById('modal-subtitle').textContent = `by ${authorVal}`;
    }

    function saveCurrentModalData() {
        const map = loadedMaps[currentIndex];
        if (!map) return;

        map.name = document.getElementById('modal-name').value.trim() || "Unknown Map";
        map.author = document.getElementById('modal-author').value.trim() || "Unknown Author";
        map.description = document.getElementById('modal-desc').value.trim();
    }

    function convertToStrictLatin(text, allowDashes = false) {
        if (!text) return "unknown";
        let t = text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        if (allowDashes) {
            t = t.replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-');
            return t.replace(/^-+|-+$/g, '') || "unknown";
        } else {
            return t.replace(/[^a-z0-9]/g, '') || "unknown";
        }
    }

    async function buildPackagedBin(map) {
        const infoObj = {
            name: map.name,
            author: map.author
        };
        if (map.description) {
            infoObj.description = map.description;
        }

        map.zipObject.file("info.json", JSON.stringify(infoObj, null, 2));
        if (map.imageBlob) {
            map.zipObject.file(map.imagePath, map.imageBlob);
        }

        const nameWithoutExt = map.fileName.substring(0, map.fileName.lastIndexOf('.')) || map.fileName;
        let rawCode = nameWithoutExt.toLowerCase().replace(/[^a-z0-9-]/g, '');
        let baseCode = rawCode.length > 8 ? rawCode.substring(0, 8) : (rawCode || "map");

        const cleanAuthor = convertToStrictLatin(map.author, false);
        const cleanMap = convertToStrictLatin(map.name, true);
        const targetBinName = `${baseCode}_${cleanAuthor}_${cleanMap}.bin`;

        const content = await map.zipObject.generateAsync({ type: "uint8array" });

        const commentStr = "Packed by CreativeCore1047";
        const commentBytes = new TextEncoder().encode(commentStr);
        
        let eocdPos = -1;
        for (let i = content.length - 22; i >= 0; i--) {
            if (content[i] === 0x50 && content[i+1] === 0x4B && content[i+2] === 0x05 && content[i+3] === 0x06) {
                eocdPos = i;
                break;
            }
        }

        let finalBytes = content;
        if (eocdPos !== -1) {
            const head = content.slice(0, eocdPos + 20);
            const commentLen = commentBytes.length;
            const lenBytes = new Uint8Array([commentLen & 0xff, (commentLen >> 8) & 0xff]);
            
            finalBytes = new Uint8Array(head.length + 2 + commentBytes.length);
            finalBytes.set(head, 0);
            finalBytes.set(lenBytes, head.length);
            finalBytes.set(commentBytes, head.length + 2);
        }

        return { name: targetBinName, data: finalBytes };
    }

    async function downloadSelectedMapPack() {
        saveCurrentModalData();
        const selectedMaps = loadedMaps.filter(m => m.selected);
        if (selectedMaps.length === 0) return;

        const packZip = new JSZip();

        for (let map of selectedMaps) {
            const packaged = await buildPackagedBin(map);
            packZip.file(packaged.name, packaged.data);
        }

        const content = await packZip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        a.download = "Splitgate_MapPack.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function copyModalFileName() {
        const map = loadedMaps[currentIndex];
        if (!map) return;
        copyText(map.fileName, 'modal-copy-btn');
    }

    function copyText(text, btnId) {
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            const originalText = btn.textContent;
            btn.textContent = '✅ Copied!';
            btn.style.background = 'var(--success)';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 2000);
        });
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('map-modal');
        if (!modal.classList.contains('active')) return;

        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

        if (e.key === 'ArrowLeft') {
            changeMap(-1);
        } else if (e.key === 'ArrowRight') {
            changeMap(1);
        } else if (e.key === 'Escape') {
            closeModal();
        }
    });
</script>
